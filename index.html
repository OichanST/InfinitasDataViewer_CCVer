<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INFINITAS Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kdam+Thmor+Pro&family=Saira+Semi+Expanded:wght@500;600&family=M+PLUS+1p:wght@500&display=swap" rel="stylesheet">
<!-- JS/CSS を変えたら ?v= の番号を上げる（ブラウザに古いファイルが残って新旧が混ざるのを防ぐ） -->
<link rel="stylesheet" href="css/style.css?v=20261113b">
</head>
<body>
<header class="top">
  <h1>INFINITAS <span>Viewer</span></h1>
  <button type="button" class="user" id="userBtn" title="表示するDJを切り替える"><span id="userName">-</span></button>
  <span class="sync" id="sync"></span>
  <button type="button" class="icon" id="rivalBtn" title="ライバル">ライバル</button>
  <button type="button" class="icon" id="reloadBtn" title="最新のデータを取得する">↻</button>
</header>

<!-- ログイン -->
<section class="login" id="login" hidden>
  <form id="loginForm">
    <h2>DJ NAME</h2>
    <p class="hint">Google スプレッドシートに登録しているDJ NAMEを入力してください。</p>
    <input id="loginId" autocomplete="username" required>
    <div class="row">
      <button type="submit" class="primary">表示する</button>
      <button type="button" id="guestBtn">楽曲だけ見る</button>
    </div>
    <p class="err" id="loginErr"></p>
  </form>
</section>

<main id="app" hidden>
  <nav class="tabs" id="viewTabs" role="tablist">
    <button type="button" role="tab" data-view="list">一覧</button><button type="button" role="tab" data-view="folder">バージョン</button><button type="button" role="tab" data-view="ability">地力表</button><button type="button" role="tab" data-view="radar">レーダー</button><button type="button" role="tab" data-view="rival">ライバル</button><button type="button" role="tab" data-view="history">履歴</button>
  </nav>

  <!-- 更新履歴（アップロードのたびに前回から変わった譜面。Google ドライブの history.json） -->
  <section class="hist" id="historyView" hidden>
    <div class="frow">
      <div class="seg" id="histStyleSeg" role="radiogroup" aria-label="プレイスタイル">
        <button type="button" data-v="SP">SP</button><button type="button" data-v="DP">DP</button>
      </div>
      <span class="muted" id="histNote"></span>
    </div>
    <div id="histBody"></div>
  </section>

  <!-- プレイヤーのノーツレーダー -->
  <section class="pradar" id="radarView" hidden>
    <div class="frow">
      <div class="seg" id="radarStyleSeg" role="radiogroup" aria-label="プレイスタイル">
        <button type="button" data-v="SP">SP</button><button type="button" data-v="DP">DP</button>
      </div>
      <span class="flabel" style="margin-left:auto">伸ばすなら</span>
      <div class="seg" id="recModeSeg" role="radiogroup" aria-label="おすすめの出し方">
        <button type="button" data-v="rate" title="そのレベルでいつも出しているレートで遊んだ場合に上がる譜面">いつものレート</button><button type="button" data-v="score" title="クリア済みの譜面で、あと何点伸ばせば上がるか">クリア済みのスコアアップ</button>
      </div>
    </div>
    <div id="radarBody"></div>
  </section>

  <!-- 地力表 -->
  <section class="ability" id="abilityView" hidden>
    <div class="frow">
      <div class="seg" id="abModeSeg" role="radiogroup" aria-label="地力表の種類">
        <button type="button" data-v="nomage">ノマゲ</button><button type="button" data-v="hard">ハード</button>
      </div>
      <span class="muted" id="abTotal"></span>
    </div>
    <div id="abGroups"></div>
    <p class="empty" id="abEmpty" hidden>地力表のデータがありません。</p>
  </section>

  <div id="listView">
  <section class="filters" id="filters">
    <div class="frow">
      <div class="seg" id="styleSeg" role="radiogroup" aria-label="プレイスタイル">
        <button type="button" data-v="SP">SP</button><button type="button" data-v="DP">DP</button>
      </div>
      <span class="flabel">LV</span><div class="chips levels" id="levelChips" aria-label="レベル"></div>
      <span class="flabel">譜面</span><div class="chips diffs" id="diffChips" aria-label="難易度"></div>
    </div>
    <div class="frow">
      <input type="search" id="q" placeholder="曲名・アーティスト・ジャンルで絞り込み">
      <select id="sort" aria-label="並べ替え">
        <option value="level">レベル順</option>
        <option value="title">曲名順</option>
        <option value="lamp">クリアランプ順</option>
        <option value="rate">スコアレート順</option>
        <option value="miss">ミスカウント順</option>
        <option value="bpm">BPM順</option>
        <option value="notes">ノーツ数順</option>
        <option value="radarNotes">レーダーNOTES順</option>
        <option value="radarPeak">レーダーPEAK順</option>
        <option value="radarScratch">レーダーSCRATCH順</option>
        <option value="radarSoflan">レーダーSOF-LAN順</option>
        <option value="radarCharge">レーダーCHARGE順</option>
        <option value="radarChord">レーダーCHORD順</option>
        <option value="rival" hidden>ライバルとの差順</option>
      </select>
      <button type="button" class="dir" id="dirBtn" title="昇順/降順">▲</button>
      <button type="button" class="more" id="moreBtn" aria-expanded="false">条件 <span id="moreCount"></span></button>
    </div>
    <div class="frow extra" id="extra" hidden>
      <label class="chk"><input type="checkbox" id="hideLocked"> 未解禁を表示しない</label>
      <span class="presets">ランプ:
        <button type="button" data-preset="noclear">未クリア</button>
        <button type="button" data-preset="nohard">未HARD</button>
        <button type="button" data-preset="noexh">未EXH</button>
        <button type="button" data-preset="nofc">未FC</button>
      </span>
      <button type="button" class="link" id="resetBtn">条件をリセット</button>
    </div>
  </section>

  <!-- バージョン（フォルダ）一覧。押すとその下に曲を開く -->
  <section class="folders" id="folderView" hidden></section>

  <!-- ライバル（上の絞り込みが効く。下の一覧は選んだライバルとの比較） -->
  <section class="rvView" id="rivalView" hidden>
    <div class="rivalsum" id="rivalSum"></div>
    <div class="frow" id="rivalCtl">
      <span class="flabel">ライバル</span><select id="rivalSel" aria-label="比べるライバル"></select>
      <div class="seg" id="rivalResSeg" role="radiogroup" aria-label="勝敗">
        <button type="button" data-v="">すべて</button><button type="button" data-v="win">WIN</button><button type="button" data-v="lose">LOSE</button><button type="button" data-v="draw">EVEN</button>
      </div>
      <span class="muted"><b class="num" id="rvTotal">0</b> 譜面</span>
    </div>
    <p class="empty" id="rvNone" hidden>右上の「ライバル」から DJ NAME を追加すると、ここで比べられます。</p>
  </section>

  <section class="summary" id="summary">
    <div class="sumhead"><b id="total">0</b> 譜面 <span class="muted" id="sumNote"></span></div>
    <div class="dist" id="lampDist"></div>
    <div class="dist" id="gradeDist"></div>
  </section>

  <section class="list" id="list" aria-live="polite"></section>
  <div id="sentinel"></div>
  <p class="empty" id="empty" hidden>条件に合う譜面がありません。</p>
  </div>
</main>

<!-- 曲の詳細 -->
<dialog id="detail"><div id="detailBody"></div><form method="dialog"><button class="close" aria-label="閉じる">×</button></form></dialog>

<!-- ライバル -->
<dialog id="rivalDlg">
  <h2>ライバル</h2>
  <p class="hint">DJ NAMEを追加すると、一覧にEXスコアの差と勝敗が出ます。</p>
  <ul id="rivalList"></ul>
  <form id="rivalForm" class="row"><input id="rivalId" placeholder="DJ NAME"><button type="submit">追加</button></form>
  <p class="err" id="rivalErr"></p>
  <form method="dialog"><button class="close" aria-label="閉じる">×</button></form>
</dialog>

<div class="toast" id="toast" hidden></div>
<div class="loading" id="loading" hidden><div class="spinner"></div><span id="loadingText">読み込み中…</span></div>

<footer class="foot"><span id="version"></span></footer>

<script src="js/api.js?v=20261113b"></script>
<script src="js/model.js?v=20261113b"></script>
<script src="js/app.js?v=20261113b"></script>
</body>
</html>
